[project]
name = "agentic-hallucination"
version = "0.1.0"
description = "Step-level hallucination detection and prevention in agentic RAG systems"
requires-python = ">=3.11,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "ollama>=0.6.3",
    "pandas>=3.0.6",
    "protobuf>=7.36.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
python-preference = "only-managed"
